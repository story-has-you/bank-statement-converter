[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-statement-parser"
version = "0.1.0"
description = "PDF bank statement parsing service"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
test = ["reportlab>=4.4,<5"]
