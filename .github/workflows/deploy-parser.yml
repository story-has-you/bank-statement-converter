name: Deploy parser to Cloudflare

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cloudflare-parser-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy parser container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy parser Worker and container
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          workingDirectory: services/parser
          command: deploy
