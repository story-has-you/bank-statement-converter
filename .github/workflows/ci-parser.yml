name: CI web and parser

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-web-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate application and parser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Lint web application
        run: pnpm lint

      - name: Build web application
        run: pnpm build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install locked parser dependencies
        working-directory: services/parser
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps .

      - name: Compile parser Python sources
        working-directory: services/parser
        run: python -m compileall -q app
