name: Validate application

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Test public account summary refresh
        run: pnpm test:account

      - name: Test spreadsheet export safety
        run: pnpm test:exports

      - name: Test merchant normalization safeguards
        run: pnpm test:merchants

      - name: Verify PDF.js parsing and conversion routes
        run: |
          pnpm verify:pdfjs
          pnpm verify:conversion

      - name: Lint web application
        run: pnpm lint

      - name: Build web application
        run: pnpm build
